<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ergonomics MCQ Practice</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--text:#e8eaf3;--muted:#9aa3b8;--line:#2a3050}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:16px;text-align:center}
  h1{margin:0;font-size:1.3rem}
  nav{display:flex;gap:8px;justify-content:center;padding:0 12px 12px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{max-width:720px;margin:0 auto;padding:0 12px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:.9rem}
  .tag{display:inline-block;font-size:.75rem;color:var(--accent);margin-bottom:6px}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:1rem}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{color:var(--text);opacity:1}
  .opt.correct{border-color:var(--ok);background:rgba(22,163,74,.15)}
  .opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.15)}
  .btn{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:1rem}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin:4px 0 10px}
  .stats{display:flex;gap:16px;justify-content:space-between}
  .stats div{text-align:center;flex:1}
  .stats b{display:block;font-size:1.4rem}
  .expl{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg);font-size:.95rem}
  .item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .hidden{display:none}
</style>
</head>
<body>
<header><h1>Ergonomics MCQ Practice</h1></header>
<nav>
  <button data-tab="home" class="active">Home</button>
  <button data-tab="weak">Weak list</button>
  <button data-tab="manage">Add / Manage</button>
</nav>
<main>
  <section id="home"></section>
  <section id="weak" class="hidden"></section>
  <section id="manage" class="hidden"></section>
</main>

<script>
// ================= BUILT-IN QUESTIONS (NPTEL Ergonomics Research Techniques, Assignments 1-11) =================

function builtinList(){
  const out=[];
  BUILTIN.forEach(([tag,list],ai)=>list.forEach(([q,options,answer,ref],qi)=>{
    out.push({id:"a"+(ai+1)+"q"+(qi+1),tag,q,options,answer,explanation:ref?("Reference: NPTEL "+ref):""});
  }));
  return out;
}

// ---------- Storage ----------
const KEY_Q="ergo_mcq_questions_v2", KEY_W="ergo_mcq_weak_v2", KEY_S="ergo_mcq_stats_v2", KEY_D="ergo_mcq_done_v2";
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let questions=load(KEY_Q,null);
if(!questions||!questions.length){questions=builtinList();save(KEY_Q,questions)}
let weak=load(KEY_W,[]);
let stats=load(KEY_S,{answered:0,correct:0});
let done=load(KEY_D,[]); // ids already answered on Home in the current round (saved, so reloads don't repeat them)

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tagsList=()=>[...new Set(questions.map(q=>q.tag||"Custom"))];

// ---------- Tabs ----------
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
function show(tab){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  ["home","weak","manage"].forEach(t=>$(t).classList.toggle("hidden",t!==tab));
  if(tab==="home")renderQuiz("home");
  if(tab==="weak")renderQuiz("weak");
  if(tab==="manage")renderManage();
}

// ---------- Quiz ----------
let filter="ALL";
const state={home:{cur:null,done:false,queue:[]},weak:{cur:null,done:false,queue:[]}};
function pool(mode){
  let p=mode==="weak"?questions.filter(q=>weak.includes(q.id)):questions.filter(q=>!done.includes(q.id));
  if(filter!=="ALL")p=p.filter(q=>(q.tag||"Custom")===filter);
  return p;
}
function scopeTotal(){
  return questions.filter(q=>filter==="ALL"||(q.tag||"Custom")===filter);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(mode){
  const st=state[mode], p=pool(mode), ids=p.map(q=>q.id);
  if(!p.length)return null;
  st.queue=st.queue.filter(id=>ids.includes(id));
  if(!st.queue.length)st.queue=shuffle(ids.slice()); // every question appears once per round
  const id=st.queue.pop();
  return p.find(q=>q.id===id);
}
function filterHTML(){
  let h=`<select id="flt-${arguments[0]}"><option value="ALL">All assignments</option>`;
  tagsList().forEach(t=>{h+=`<option value="${esc(t)}"${t===filter?" selected":""}>${esc(t)}</option>`});
  return h+`</select>`;
}
function renderQuiz(mode){
  const el=$(mode), st=state[mode];
  const acc=stats.answered?Math.round(100*stats.correct/stats.answered):0;
  let html="";
  if(mode==="home"){
    html+=`<div class="card stats"><div><b>${questions.length}</b><span class="muted">Questions</span></div>
      <div><b>${stats.answered}</b><span class="muted">Answered</span></div>
      <div><b>${acc}%</b><span class="muted">Accuracy</span></div>
      <div><b>${weak.length}</b><span class="muted">Weak</span></div></div>`;
  }else{
    html+=`<div class="card"><b>Weak list</b><div class="muted">Questions you got wrong. Answer one correctly to remove it. (${weak.length} total)</div></div>`;
  }
  html+=`<div class="card" style="padding:8px 16px 0">${filterHTML(mode)}</div>`;
  // never show an already-answered question again (e.g. after switching tabs)
  if(!st.cur||st.done||!pool(mode).some(q=>q.id===st.cur.id)){st.cur=pick(mode);st.done=false}
  const q=st.cur;
  if(mode==="home"){
    const tot=scopeTotal(), n=tot.filter(x=>done.includes(x.id)).length;
    html+=`<div class="muted" style="margin:0 4px 8px">Progress: ${n} / ${tot.length} answered this round</div>`;
  }
  if(!q){
    if(mode==="weak"){
      html+=`<div class="card">Nothing in your weak list for this filter. 🎉</div>`;
    }else if(questions.length&&scopeTotal().length){
      html+=`<div class="card"><b>Round complete 🎉</b><div class="muted" style="margin:6px 0 12px">You have answered every question${filter==="ALL"?"":" in this group"}. Start a new round to go through them again.</div><button class="btn" id="restart">Start new round</button></div>`;
    }else{
      html+=`<div class="card">No questions here. Add some in the Add / Manage tab.</div>`;
    }
  }else{
    html+=`<div class="card"><div class="tag">${esc(q.tag||"Custom")}</div><div style="font-weight:600;margin-bottom:6px">${esc(q.q)}</div><div id="opts-${mode}">`;
    q.options.forEach((o,i)=>{html+=`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`});
    html+=`</div><div id="fb-${mode}"></div>
      <div class="row" style="margin-top:12px"><button class="btn hidden" id="next-${mode}">Next</button>
      <button class="btn ghost" id="skip-${mode}">Skip</button></div></div>`;
  }
  el.innerHTML=html;
  $("flt-"+mode).onchange=e=>{filter=e.target.value;["home","weak"].forEach(m=>{state[m].cur=null;state[m].queue=[]});renderQuiz(mode)};
  if(!q){
    const rb=$("restart");
    if(rb)rb.onclick=()=>{
      const ids=scopeTotal().map(x=>x.id);
      done=done.filter(id=>!ids.includes(id));save(KEY_D,done);
      state.home.cur=null;state.home.queue=[];renderQuiz("home");
    };
    return;
  }
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(mode,+b.dataset.i));
  const nxt=()=>{st.cur=pick(mode);st.done=false;renderQuiz(mode)};
  $("next-"+mode).onclick=nxt;$("skip-"+mode).onclick=nxt;
}
function answer(mode,i){
  const st=state[mode];if(st.done)return;st.done=true;
  const q=st.cur, ok=i===q.answer;
  stats.answered++;if(ok)stats.correct++;save(KEY_S,stats);
  if(!ok&&!weak.includes(q.id))weak.push(q.id);
  if(ok&&mode==="weak")weak=weak.filter(id=>id!==q.id);
  save(KEY_W,weak);
  if(mode==="home"&&!done.includes(q.id)){done.push(q.id);save(KEY_D,done)}
  document.querySelectorAll(`#opts-${mode} .opt`).forEach((b,idx)=>{b.disabled=true;if(idx===q.answer)b.classList.add("correct");else if(idx===i)b.classList.add("wrong")});
  $("fb-"+mode).innerHTML=`<div class="expl"><b>${ok?"Correct ✅":"Wrong ❌ — added to weak list"}</b>${ok?"":"<br>Correct answer: "+String.fromCharCode(65+q.answer)+". "+esc(q.options[q.answer])}${q.explanation?"<br>"+esc(q.explanation):""}</div>`;
  $("next-"+mode).classList.remove("hidden");
  $("skip-"+mode).classList.add("hidden");
}

// ---------- Add / Manage ----------
function renderManage(){
  const el=$("manage");
  let html=`<div class="card"><b>Add a question</b>
    <label class="muted">Group (e.g. Assignment 12)</label>
    <input id="ntag" list="taglist" placeholder="Custom"><datalist id="taglist">${tagsList().map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
    <label class="muted">Question</label><textarea id="nq" rows="2"></textarea>
    <label class="muted">Options (A–D)</label>
    <input id="o0" placeholder="Option A"><input id="o1" placeholder="Option B">
    <input id="o2" placeholder="Option C"><input id="o3" placeholder="Option D">
    <label class="muted">Correct answer</label>
    <select id="ans"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
    <label class="muted">Explanation (optional)</label><textarea id="ex" rows="2"></textarea>
    <button class="btn" id="add">Add question</button></div>

    <div class="card"><b>Bulk import / export</b>
    <div class="muted">JSON array: [{"tag":"Assignment 12","q":"...","options":["a","b","c","d"],"answer":0,"explanation":"..."}] (answer is 0-based)</div>
    <textarea id="bulk" rows="5"></textarea>
    <div class="row"><button class="btn" id="imp">Import (adds)</button>
    <button class="btn ghost" id="exp">Export all</button>
    <button class="btn ghost" id="rw">Reset weak list</button>
    <button class="btn ghost" id="rs">Reset stats</button>
    <button class="btn ghost" id="rst">Restore built-in questions</button>
    <button class="btn danger" id="clr">Delete all</button></div>
    <div id="msg" class="muted" style="margin-top:8px"></div></div>

    <div class="card"><b>All questions (${questions.length})</b>`;
  let last=null;
  questions.forEach(q=>{
    const t=q.tag||"Custom";
    if(t!==last){html+=`<div class="tag" style="margin-top:10px">${esc(t)}</div>`;last=t}
    html+=`<div class="item"><div>${esc(q.q)}<div class="muted">Answer: ${String.fromCharCode(65+q.answer)}</div></div>
      <button class="btn ghost" data-del="${q.id}">Delete</button></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;

  $("add").onclick=()=>{
    const text=$("nq").value.trim();
    const opts=[0,1,2,3].map(i=>$("o"+i).value.trim()).filter(Boolean);
    const a=+$("ans").value;
    if(!text||opts.length<2||a>=opts.length){$("msg").textContent="Enter a question, at least 2 options, and a valid correct answer.";return}
    questions.push({id:uid(),tag:$("ntag").value.trim()||"Custom",q:text,options:opts,answer:a,explanation:$("ex").value.trim()});
    save(KEY_Q,questions);renderManage();
  };
  $("imp").onclick=()=>{
    try{
      const arr=JSON.parse($("bulk").value);
      if(!Array.isArray(arr))throw 0;
      let n=0;
      arr.forEach(x=>{
        if(x&&x.q&&Array.isArray(x.options)&&x.options.length>=2&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.options.length){
          questions.push({id:uid(),tag:x.tag||"Custom",q:x.q,options:x.options,answer:x.answer,explanation:x.explanation||""});n++;
        }
      });
      save(KEY_Q,questions);renderManage();$("msg").textContent=`Imported ${n} question(s).`;
    }catch(e){$("msg").textContent="Invalid JSON. Check the format."}
  };
  $("exp").onclick=()=>{$("bulk").value=JSON.stringify(questions.map(({id,...r})=>r),null,2)};
  $("rw").onclick=()=>{weak=[];save(KEY_W,weak);$("msg").textContent="Weak list cleared."};
  $("rs").onclick=()=>{stats={answered:0,correct:0};save(KEY_S,stats);done=[];save(KEY_D,done);$("msg").textContent="Stats and round progress reset."};
  $("rst").onclick=()=>{if(confirm("Replace everything with the 110 built-in questions? Your added questions will be removed.")){questions=builtinList();weak=[];done=[];save(KEY_Q,questions);save(KEY_W,weak);save(KEY_D,done);renderManage()}};
  $("clr").onclick=()=>{if(confirm("Delete ALL questions?")){questions=[];weak=[];done=[];save(KEY_Q,questions);save(KEY_W,weak);save(KEY_D,done);renderManage()}};
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    questions=questions.filter(q=>q.id!==b.dataset.del);weak=weak.filter(id=>id!==b.dataset.del);done=done.filter(id=>id!==b.dataset.del);
    save(KEY_Q,questions);save(KEY_W,weak);save(KEY_D,done);renderManage();
  });
}

show("home");
</script>
</body>
</html>
